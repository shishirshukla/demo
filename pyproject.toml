[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-regime-lab"
version = "0.1.0"
description = "Modular NSE regime strategy research and backtesting"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "PyYAML>=6,<7", "streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]
market-data = ["yfinance>=0.2.65,<2"]

[project.scripts]
nifty-backtest = "trading_system.main:main"
nifty-download = "trading_system.data.yfinance_downloader:main"

[tool.setuptools.packages.find]
include = ["trading_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

